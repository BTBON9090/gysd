lass="pages"><button data-page="${state.page-1}" ${state.page===1?'disabled':''} aria-label="上一页">‹</button>${Array.from({length:pages},(_,i)=>`<button class="${state.page===i+1?'active':''}" data-page="${i+1}">${i+1}</button>`).join('')}<button data-page="${state.page+1}" ${state.page===pages?'disabled':''} aria-label="下一页">›</button></div></div></section><p class="note">本页面为独立交互方案，使用示例数据。园区状态、价格与库存仅用于展示设计思路。</p></div></main></div>${state.modal?modal():''}${state.toast?`<div class="toast" role="status">${esc(state.toast)}</div>`:''}`;
const input=document.getElementById('search');input.addEventListener('input',e=>{let pos=e.target.selectionStart;state.query=e.target.value;state.page=1;render();const n=document.getElementById('search');n.focus();n.setSelectionRange(pos,pos)});document.getElementById('park').onchange=e=>{state.park=e.target.value;state.page=1;render()};document.getElementById('sort').onchange=e=>{state.sort=e.target.value;render()};}
function row(x,isP){let p=state.park?x.parks.find(p=>p.name===state.park):null;let issue=state.park?(p?.status==='reject'?p:null):x.parks.find(p=>p.status==='reject');let prices=x.parks.map(p=>p.price).filter(Number.isFinite);let price=isP?(prices.length?(state.park&&p?`¥${p.price.toFixed(2)}`:prices.length>1&&new Set(prices).size>1?`¥${Math.min(...prices).toFixed(2)}–${Math.max(...prices).toFixed(2)}`:`¥${prices[0].toFixed(2)}`):'—'):x.specs[0]?.[1]||'—';let priceSub=isP?(x.parks.length?(state.park?`库存 ${p.stock} 件`:`${x.parks.length} 个园区 · 展开查看库存`):'发布后设置园区价格'):`${x.specs[0]?.[0]||''}${x.specs.length>1?` · 共 ${x.specs.length} 个规格`:''}`;let selected=relevantParks(x), on=selected.some(p=>p.status==='on'), canPublish=selected.some(p=>['offline','reject'].includes(p.status));let pending=!!x.pending||x.parks.some(p=>p.status==='review');let reasons={publish:(isP&&pending)?'存在待审核事项，请先完成审核':canPublish?'':(x.status==='draft'?'草稿请先继续发布':'当前园区没有可上架的项目'),price:!isP?'服务价格通过编辑服务规格调整':pending?'存在待审核事项，请先完成审核':!on?'仅已上架园区可调价':'',stock:!isP?'服务不需要管理商品库存':!on?'仅已上架园区可修改库存':''};let actionButton=(label,kind,reason='')=>`<button class="action-btn" data-do="${x.id}" data-kind="${kind}" ${reason?`aria-disabled="true" data-reason="${esc(reason)}" title="${esc(reason)}"`:''}>${label}</button>`;return `<article class="item"><div class="row-main"><div class="identity"><div class="thumb ${x.tone}" aria-hidden="true">${x.icon}</div><div><button class="name" data-expand="${x.id}">${esc(x.name)}</button><div class="meta">${esc(x.code)}　｜　${esc(x.category)}</div></div></div><div>${status(effective(x))}<div class="subline ${issue?'issue':''}">${issue?`${esc(issue.name)}：已驳回`:(x.pending|| (x.parks.length?`${x.parks.length} 个园区${state.park?' · 已按所选园区显示':''}`:'尚未选择园区'))}</div>${x.parks.length?`<button class="expand" data-expand="${x.id}" aria-expanded="${state.expanded===x.id}">${state.expanded===x.id?'收起':'查看'}园区详情 ${state.expanded===x.id?'⌃':'⌄'}</button>`:''}</div><div><div class="price">${esc(price)}</div><div class="subline">${esc(priceSub)}</div></div><div><div>${x.updated}</div><div class="subline">销量 ${x.sales}</div></div><div class="actions" aria-label="${esc(x.name)}的操作">${actionButton("详情","查看详情")}${actionButton("上架","申请上架",reasons.publish)}${actionButton("调价","调整价格",reasons.price)}${actionButton("改库存","管理库存",reasons.stock)}${actionButton("审批记录","审核记录")}<button class="action-btn action-more" data-more="${x.id}">更多 ⌄</button></div></div>${state.expanded===x.id?`<div class="expanded"><div class="expanded-title">园区明细${isP?' · 园区配置价格与库存':' · 上架状态'}${!isP?' / 服务规格':''}</div>${x.parks.length?x.parks.map(p=>`<div class="park-line"><b>${esc(p.name)}</b><span>${status(p.status)}</span><span>${isP?`¥${p.price.toFixed(2)}　库存 ${p.stock} 件`:'按园区独立审核'}</span><span class="${p.reason?'issue':''}">${esc(p.reason||'')}</span></div>`).join(''):'<span class="muted">暂无园区信息</span>'}${!isP?`<div class="park-line"><b>服务规格</b><span style="grid-column:span 3">${x.specs.map(s=>esc(s.join('：'))).join('　 /　')}</span></div>`:''}</div>`:''}</article>`}
function modal(){let m=state.modal;if(m.kind==='explain')return `<div class="modal-backdrop"><section class="modal wide" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">从现有页面到新方案</h2><button class="close" data-close aria-label="关闭">×</button></div><div class="modal-body"><h3>现有页面的问题</h3><ul><li><b>阅读顺序分散：</b>名称、状态、园区、价格和操作分布在卡片不同位置，需要反复横向查找。</li><li><b>重要状态容易遗漏：</b>整体状态可能掩盖其他园区的驳回；部分园区和驳回原因被折叠或藏在悬停中。</li><li><b>价格语境不清：</b>商品显示默认价格，实际各园区可能不同；库存要打开操作才能判断。</li><li><b>动作优先级不符合日常任务：</b>编辑、库存等常用操作与低频操作竞争，服务编辑的下架影响也不够提前明确。</li><li><b>定位成本较高：</b>名称和编码分开输入并需查询，筛选结果为空时缺少清晰的恢复路径。</li></ul><h3>新的管理路径</h3><p>先通过待处理概览发现异常，再用名称、编码或园区定位对象。列表按“对象 → 状态和待办 → 价格或规格 → 更新时间 → 操作”对齐；展开行即可查看每个园区的状态和原因。</p><p>选择园区后，行状态跟随所选园区；不选择园区时，整体状态旁直接提示被驳回的园区。商品展示价格范围和逐园库存，服务保留规格报价。详情、上架、调价、改库存和审批记录固定显示在每行右侧，以两行排列；当前不可执行的操作保留位置并说明原因，其他操作集中在更多中。</p><h3>交互边界</h3><p>这是独立的前端演示，数据和操作仅在当前页面内模拟。上架按园区提交审核；服务编辑前提示受影响园区；商品调价审核期间保留当前生效价格。</p></div><div class="modal-foot"><button class="btn primary" data-close>知道了</button></div></section></div>`;
let x=data().find(v=>v.id===m.id);if(!x)return '';let title=m.kind;let body='';if(m.kind==='更多操作'){body=`<p><b>${esc(x.name)}</b></p><p>选择要执行的操作：</p><div style="display:flex;gap:8px;flex-wrap:wrap">${[...(x.parks.some(p=>p.status==='reject')?['处理驳回']:[]),...(x.status==='draft'?['继续发布']:[]),'编辑',...(x.parks.some(p=>p.status==='on')?['下架']:[]),'删除'].map(a=>`<button class="btn small" data-do="${x.id}" data-kind="${a}">${a}</button>`).join('')}</div>`}else if(m.kind==='处理驳回'){body=`<p><b>${esc(x.name)}</b></p>${x.parks.filter(p=>p.status==='reject').map(p=>`<div class="callout"><b>${esc(p.name)} · 审核驳回</b><br>${esc(p.reason)}</div>`).join('')}<p style="margin-top:14px">修改相关内容后，可重新提交园区审核。</p>`}else if(m.kind==='编辑'&&state.type==='service'&&x.parks.some(p=>p.status==='on'||p.status==='review')){body=`<p><b>${esc(x.name)}</b></p><div class="callout">编辑并提交后，以下园区中已上架或审核中的服务将先下架，需要重新提交审核：<br><b>${x.parks.filter(p=>p.status==='on'||p.status==='review').map(p=>esc(p.name)).join('、')}</b></div>`}else if(m.kind==='申请上架'||m.kind==='下架'){let candidates=relevantParks(x).filter(p=>m.kind==='申请上架'?['offline','reject'].includes(p.status):p.status==='on');body=`<p><b>${esc(x.name)}</b></p><p>选择需要${m.kind==='申请上架'?'提交上架审核':'下架'}的园区：</p>${candidates.length?candidates.map(p=>`<label class="check-line"><input type="checkbox" name="parkTarget" value="${esc(p.name)}">${esc(p.name)} <span class="muted">（${labels[p.status]}）</span></label>`).join(''):'<p class="muted">当前没有符合条件的园区。</p>'}` }else if(m.kind==='管理库存'){body=`<p><b>${esc(x.name)}</b></p><p>选择园区并更新当前库存：</p><select id="editPark">${relevantParks(x).filter(p=>p.status==='on').map(p=>`<option value="${esc(p.name)}">${esc(p.name)}（库存 ${p.stock}）</option>`).join('')}</select><div class="form-row"><label for="stock">库存数量</label><input id="stock" type="number" min="0" value="${relevantParks(x).find(p=>p.status==='on')?.stock||0}"> 件</div>`}else if(m.kind==='调整价格'){body=`<p><b>${esc(x.name)}</b></p><p>调价按园区提交审核，审核期间当前价格继续生效。</p><select id="editPark">${relevantParks(x).filter(p=>p.status==='on').map(p=>`<option value="${esc(p.name)}">${esc(p.name)}（当前 ¥${p.price.toFixed(2)}）</option>`).join('')}</select><div class="form-row"><label for="newPrice">申请价格</label><input id="newPrice" type="number" min="0" step="0.01" value="${relevantParks(x).find(p=>p.status==='on')?.price||0}"> 元</div>`}else if(m.kind==='删除'){body=x.sales?'<p>该项目已有订单，不能删除。</p>':`<p>确定删除“${esc(x.name)}”吗？删除后将从列表移除。</p>`}else if(m.kind==='查看详情'||m.kind==='审核记录'||m.kind==='查看进度'){body=`<p><b>${esc(x.name)}</b>　${esc(x.code)}</p><p>${m.kind==='查看详情'?`${esc(x.category)}；最近更新 ${x.updated}；累计销量 ${x.sales}。`:'请展开列表中的园区明细，查看各园区当前审核状态和驳回原因。'}</p>`}else{body=`<p><b>${esc(x.name)}</b></p><p>此处展示进入${esc(m.kind)}流程的交互入口。当前为独立方案预览。</p>`}let confirm=!['更多操作','查看详情','审核记录','查看进度'].includes(m.kind)&&!(m.kind==='删除'&&x.sales);return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">${esc(title)}</h2><button class="close" data-close aria-label="关闭">×</button></div><div class="modal-body">${body}</div><div class="modal-foot"><button class="btn" data-close>${confirm?'取消':'关闭'}</button>${confirm?`<button class="btn primary" data-confirm>${m.kind==='删除'?'确认删除':m.kind==='处理驳回'?'去修改':m.kind==='编辑'?'继续编辑':m.kind==='申请上架'?'提交审核':m.kind==='下架'?'确认下架':m.kind==='管理库存'?'保存库存':m.kind==='调整价格'?'提交调价':'继续'}</button>`:''}</div></section></div>`}
function notice(s){state.toast=s;render();setTimeout(()=>{state.toast='';render()},2500)}
app.addEventListener('click',e=>{let target=e.target.closest('button');if(!target)return;if(target.dataset.reason){notice(target.dataset.reason);return}if(target.dataset.type){state.type=target.dataset.type;state.query='';state.park='';state.tab='all';state.page=1;state.expanded=null;render()}else if(target.dataset.tab){state.tab=target.dataset.tab;state.page=1;render()}else if(target.dataset.page){state.page=Number(target.dataset.page);render();document.querySelector('.workspace').scrollIntoView({behavior:'smooth'})}else if(target.dataset.expand){let id=Number(target.dataset.expand);state.expanded=state.expanded===id?null:id;render()}else if(target.dataset.more){state.modal={kind:'更多操作',id:Number(target.dataset.more)};render()}else if(target.dataset.do){state.modal={kind:target.dataset.kind,id:Number(target.dataset.do)};render()}else if(target.hasAttribute('data-close')){state.modal=null;render()}else if(target.dataset.action==='explain'){state.modal={kind:'explain'};render()}else if(target.dataset.action==='create'){notice('此处进入新建流程；当前为列表方案预览')}else if(target.dataset.action==='reset'){state.query='';state.park='';state.tab='all';state.page=1;render()}else if(target.hasAttribute('data-confirm')){let m=state.modal,x=data().find(v=>v.id===m.id);if(m.kind==='申请上架'||m.kind==='下架'){let names=[...document.querySelectorAll('input[name=parkTarget]:checked')].map(n=>n.value);if(!names.length){notice('请先选择园区');return}x.parks.filter(p=>names.includes(p.name)).forEach(p=>p.status=m.kind==='申请上架'?'review':'offline');x.status=x.parks.some(p=>p.status==='on')?'on':x.parks.some(p=>p.status==='review')?'review':x.parks.some(p=>p.status==='reject')?'reject':'offline';state.modal=null;notice(m.kind==='申请上架'?'已模拟提交审核':'已模拟下架')}else if(m.kind==='管理库存'){let n=Number(document.getElementById('stock').value),p=x.parks.find(p=>p.name===document.getElementById('editPark').value);if(!Number.isInteger(n)||n<0){notice('请输入非负整数库存');return}p.stock=n;state.modal=null;notice('库存已更新（仅本页演示）')}else if(m.kind==='调整价格'){let n=Number(document.getElementById('newPrice').value);if(!Number.isFinite(n)||n<=0){notice('请输入大于 0 的价格');return}x.pending='调价审核中，当前价格仍生效';state.modal=null;notice('调价已模拟提交审核')}else if(m.kind==='删除'){data().splice(data().indexOf(x),1);state.modal=null;notice('已从演示列表删除')}else{state.modal=null;notice('此处进入后续流程；当前为列表方案预览')}}});
app.addEventListener('change',e=>{if(e.target.id==='editPark'&&state.modal?.kind==='管理库存'){let x=data().find(v=>v.id===state.modal.id);document.getElementById('stock').value=x.parks.find(p=>p.name===e.target.value).stock}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render()}});render();
</script></body></html>
